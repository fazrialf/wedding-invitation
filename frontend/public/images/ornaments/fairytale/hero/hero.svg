<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0B2E"/>
      <stop offset="60%" stop-color="#1A1145"/>
      <stop offset="100%" stop-color="#2D1B69"/>
    </linearGradient>
    <linearGradient id="auroraGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D68F" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00D68F" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#00D68F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D68F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00B4D8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00B4D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B2FBE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B2FBE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7B2FBE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0C0C0" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E8E8FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#E8E8FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C0C0C0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0F30"/>
      <stop offset="100%" stop-color="#0D0B2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  <!-- Stars (20+) -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="50" cy="30" r="1.2"/><circle cx="120" cy="65" r="0.8"/>
    <circle cx="200" cy="20" r="1.5"/><circle cx="280" cy="90" r="1"/>
    <circle cx="350" cy="45" r="0.7"/><circle cx="430" cy="75" r="1.3"/>
    <circle cx="510" cy="25" r="1.1"/><circle cx="580" cy="55" r="0.9"/>
    <circle cx="650" cy="35" r="1.4"/><circle cx="720" cy="80" r="1"/>
    <circle cx="90" cy="110" r="0.6"/><circle cx="170" cy="140" r="1.2"/>
    <circle cx="310" cy="130" r="0.8"/><circle cx="460" cy="120" r="1"/>
    <circle cx="560" cy="100" r="1.5"/><circle cx="690" cy="150" r="0.7"/>
    <circle cx="750" cy="45" r="1.1"/><circle cx="40" cy="170" r="0.9"/>
    <circle cx="400" cy="160" r="1.3"/><circle cx="620" cy="170" r="0.8"/>
    <circle cx="250" cy="180" r="1"/><circle cx="530" cy="155" r="0.6"/>
    <circle cx="150" cy="200" r="0.7"/><circle cx="680" cy="195" r="1.1"/>
  </g>
  <!-- Crescent Moon -->
  <g filter="url(#softGlow)">
    <path d="M710 60 A35 35 0 1 1 710 130 A25 25 0 1 0 710 60" fill="#FFFDE7" opacity="0.9"/>
  </g>
  <!-- Aurora Borealis Streaks -->
  <path d="M0 120 C100 80, 200 150, 300 100 S500 60, 600 110 S750 80, 800 120" stroke="url(#auroraGreen)" stroke-width="18" fill="none" opacity="0.5" filter="url(#bigGlow)"/>
  <path d="M0 160 C150 120, 250 190, 400 140 S550 100, 650 150 S780 130, 800 160" stroke="url(#auroraTeal)" stroke-width="14" fill="none" opacity="0.4" filter="url(#bigGlow)"/>
  <path d="M0 200 C120 170, 280 220, 380 180 S520 150, 620 190 S740 170, 800 200" stroke="url(#auroraViolet)" stroke-width="20" fill="none" opacity="0.35" filter="url(#bigGlow)"/>
  <!-- Distant Castle Spire -->
  <g fill="#15103A" opacity="0.7">
    <rect x="370" y="240" width="60" height="80"/>
    <polygon points="370,240 400,200 430,240"/>
    <rect x="385" y="220" width="8" height="30"/>
    <polygon points="385,220 389,205 393,220"/>
    <rect x="415" y="225" width="6" height="25"/>
    <polygon points="415,225 418,212 421,225"/>
    <rect x="360" y="270" width="10" height="50"/>
    <polygon points="360,270 365,258 370,270"/>
  </g>
  <!-- Ancient Gnarled Trees -->
  <g fill="#0A0718">
    <!-- Tree 1 - left -->
    <path d="M80 600 L80 350 C60 330, 40 280, 50 250 C55 230, 70 220, 65 200 C60 180, 50 160, 55 140 C58 125, 70 115, 80 120 C90 125, 85 140, 90 160 C95 180, 110 190, 105 210 C100 230, 90 250, 95 280 L110 260 C115 240, 130 230, 125 250 C120 270, 105 290, 100 320 L100 600 Z"/>
    <!-- Tree 2 - center-left -->
    <path d="M230 600 L225 380 C210 350, 195 300, 200 260 C205 230, 220 210, 215 190 C210 170, 200 150, 210 140 C220 130, 235 145, 240 160 C245 175, 250 200, 255 220 C260 240, 270 230, 268 250 C265 270, 250 300, 248 340 L260 310 C265 290, 275 280, 273 300 C270 320, 255 350, 250 380 L250 600 Z"/>
    <!-- Tree 3 - right -->
    <path d="M650 600 L645 360 C630 320, 615 280, 620 240 C625 210, 640 195, 635 175 C630 155, 620 140, 630 130 C640 120, 655 135, 660 150 C665 170, 670 195, 675 210 C680 230, 690 220, 688 240 C685 260, 670 290, 665 330 L680 300 C685 280, 700 270, 695 290 C690 310, 672 340, 670 360 L670 600 Z"/>
    <!-- Tree 4 - far right -->
    <path d="M740 600 L738 400 C730 370, 720 340, 725 310 C730 285, 745 275, 740 255 C735 235, 725 220, 735 215 C745 210, 755 225, 758 240 C760 260, 755 280, 758 310 L758 600 Z"/>
  </g>
  <!-- Ground -->
  <path d="M0 500 C100 480, 200 490, 300 485 S500 495, 600 490 S750 500, 800 495 L800 600 L0 600 Z" fill="url(#groundGrad)"/>
  <!-- Crystal Stream -->
  <path d="M0 510 C80 505, 160 520, 240 512 S400 505, 480 515 S640 508, 720 518 S780 510, 800 515" stroke="url(#streamGrad)" stroke-width="6" fill="none" filter="url(#glow)" opacity="0.7"/>
  <path d="M0 515 C80 520, 160 512, 240 518 S400 525, 480 515 S640 522, 720 514 S780 520, 800 518" stroke="url(#streamGrad)" stroke-width="3" fill="none" opacity="0.4"/>
  <!-- Bioluminescent Mushrooms at tree bases -->
  <g filter="url(#glow)">
    <ellipse cx="70" cy="505" rx="8" ry="5" fill="#00D68F" opacity="0.8"/>
    <rect x="68" y="505" width="4" height="12" fill="#008866" opacity="0.6"/>
    <ellipse cx="95" cy="510" rx="6" ry="4" fill="#00B4D8" opacity="0.7"/>
    <rect x="93" y="510" width="3" height="10" fill="#007799" opacity="0.5"/>
    <ellipse cx="240" cy="500" rx="7" ry="4" fill="#00D68F" opacity="0.75"/>
    <rect x="238" y="500" width="4" height="11" fill="#008866" opacity="0.5"/>
    <ellipse cx="260" cy="508" rx="5" ry="3" fill="#7B2FBE" opacity="0.8"/>
    <rect x="258" y="508" width="3" height="9" fill="#5A1F8E" opacity="0.5"/>
    <ellipse cx="645" cy="505" rx="9" ry="5" fill="#00B4D8" opacity="0.7"/>
    <rect x="643" y="505" width="4" height="13" fill="#007799" opacity="0.5"/>
    <ellipse cx="670" cy="510" rx="6" ry="4" fill="#00D68F" opacity="0.8"/>
    <rect x="668" y="510" width="3" height="10" fill="#008866" opacity="0.5"/>
    <ellipse cx="745" cy="508" rx="7" ry="4" fill="#7B2FBE" opacity="0.7"/>
    <rect x="743" y="508" width="3" height="10" fill="#5A1F8E" opacity="0.5"/>
  </g>
  <!-- Fireflies (10+) -->
  <g filter="url(#glow)">
    <circle cx="130" cy="320" r="2.5" fill="#FFD700" opacity="0.9"/>
    <circle cx="180" cy="280" r="2" fill="#FFD700" opacity="0.7"/>
    <circle cx="200" cy="400" r="3" fill="#FFD700" opacity="0.85"/>
    <circle cx="320" cy="350" r="2.5" fill="#FFD700" opacity="0.75"/>
    <circle cx="380" cy="420" r="2" fill="#FFD700" opacity="0.8"/>
    <circle cx="450" cy="300" r="2.5" fill="#FFD700" opacity="0.9"/>
    <circle cx="500" cy="380" r="3" fill="#FFD700" opacity="0.7"/>
    <circle cx="550" cy="340" r="2" fill="#FFD700" opacity="0.85"/>
    <circle cx="600" cy="420" r="2.5" fill="#FFD700" opacity="0.75"/>
    <circle cx="700" cy="350" r="2" fill="#FFD700" opacity="0.8"/>
    <circle cx="160" cy="450" r="2.5" fill="#FFD700" opacity="0.7"/>
    <circle cx="480" cy="460" r="2" fill="#FFD700" opacity="0.9"/>
  </g>
</svg>