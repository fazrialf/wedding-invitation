<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="600" height="80">
  <defs>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B2FBE" stop-opacity="0"/>
      <stop offset="15%" stop-color="#7B2FBE" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#5B4FBE" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00B4D8" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#00B4D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B2FBE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#9B4FD8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3DA8D8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#00B4D8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crystalFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C0C0C0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7B2FBE" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Central flowing ribbon - main wave -->
  <path d="M0 40 C50 25, 100 55, 150 35 S250 20, 300 40 S400 55, 450 35 S550 20, 600 40" stroke="url(#ribbonGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Secondary ribbon wave -->
  <path d="M0 42 C60 55, 110 28, 160 45 S260 58, 310 38 S410 25, 460 45 S560 55, 600 42" stroke="url(#ribbonGrad2)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Thin accent ribbon -->
  <path d="M20 38 C80 30, 130 50, 180 32 S280 25, 330 42 S430 52, 480 32 S570 28, 590 38" stroke="url(#ribbonGrad)" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Crystal diamond shapes at intervals -->
  <g filter="url(#glow)">
    <polygon points="150,40 155,33 160,40 155,47" fill="url(#crystalFill)" opacity="0.8"/>
    <polygon points="300,40 304,34 308,40 304,46" fill="url(#crystalFill)" opacity="0.75"/>
    <polygon points="450,40 454,34 458,40 454,46" fill="url(#crystalFill)" opacity="0.7"/>
  </g>
  <!-- Scattered Stars (15-20) -->
  <g filter="url(#glow)">
    <!-- Gold stars -->
    <circle cx="60" cy="20" r="1.5" fill="#FFD700" opacity="0.8"/>
    <circle cx="120" cy="60" r="1.2" fill="#FFD700" opacity="0.7"/>
    <circle cx="200" cy="15" r="1.8" fill="#FFD700" opacity="0.85"/>
    <circle cx="260" cy="65" r="1.3" fill="#FFD700" opacity="0.6"/>
    <circle cx="340" cy="18" r="1.5" fill="#FFD700" opacity="0.75"/>
    <circle cx="400" cy="62" r="1.2" fill="#FFD700" opacity="0.7"/>
    <circle cx="480" cy="22" r="1.6" fill="#FFD700" opacity="0.8"/>
    <circle cx="540" cy="58" r="1.3" fill="#FFD700" opacity="0.65"/>
    <!-- Silver stars -->
    <circle cx="90" cy="45" r="1" fill="#C0C0C0" opacity="0.6"/>
    <circle cx="180" cy="55" r="1.4" fill="#C0C0C0" opacity="0.55"/>
    <circle cx="370" cy="55" r="1.2" fill="#C0C0C0" opacity="0.5"/>
    <circle cx="520" cy="15" r="1.1" fill="#C0C0C0" opacity="0.6"/>
  </g>
  <!-- Sparkle Crosses (4-pointed stars) -->
  <g fill="#C0C0C0" filter="url(#glow)">
    <path d="M100 30 L101.5 34 L105 35.5 L101.5 37 L100 41 L98.5 37 L95 35.5 L98.5 34 Z" opacity="0.7"/>
    <path d="M230 50 L231 53 L234 54 L231 55 L230 58 L229 55 L226 54 L229 53 Z" opacity="0.6"/>
    <path d="M420 25 L421.5 29 L425 30.5 L421.5 32 L420 36 L418.5 32 L415 30.5 L418.5 29 Z" opacity="0.65"/>
    <path d="M560 45 L561 48 L564 49 L561 50 L560 53 L559 50 L556 49 L559 48 Z" opacity="0.55"/>
  </g>
  <!-- Tiny Crescent Moons (2-3) -->
  <g filter="url(#softGlow)">
    <path d="M75 12 A8 8 0 1 1 75 28 A5.5 5.5 0 1 0 75 12" fill="#FFFDE7" opacity="0.7"/>
    <path d="M350 55 A6 6 0 1 1 350 67 A4 4 0 1 0 350 55" fill="#FFFDE7" opacity="0.6"/>
    <path d="M530 8 A7 7 0 1 1 530 22 A5 5 0 1 0 530 8" fill="#FFFDE7" opacity="0.65"/>
  </g>
  <!-- Edge fade overlays -->
  <rect x="0" y="0" width="80" height="80" fill="url(#ribbonGrad)" opacity="0">
    <animate attributeName="opacity" values="0" dur="1s"/>
  </rect>
  <!-- Fade-out at edges using gradient overlays -->
  <defs>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>