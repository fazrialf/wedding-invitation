<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Sky gradient - misty teal-green atmosphere -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BC8B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A8C7F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5E54;stop-opacity:1" />
    </linearGradient>
    
    <!-- Mountain gradients -->
    <linearGradient id="mountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6B5C;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3A5548;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3A5548;stop-opacity:0.75" />
      <stop offset="100%" style="stop-color:#2D4538;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="mountainNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D4538;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#1F3528;stop-opacity:1" />
    </linearGradient>
    
    <!-- Water gradient for fountain -->
    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A8D8E8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6BACC8;stop-opacity:0.7" />
    </radialGradient>
    
    <!-- Wood gradient for buildings -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5237;stop-opacity:1" />
    </linearGradient>
    
    <!-- Roof gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A3828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E2418;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blur filter for atmospheric perspective -->
    <filter id="blurFar">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
    <filter id="blurMid">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
    
    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A7C5C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A6048;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#skyGrad)" />
  
  <!-- Distant mountains (blurred) -->
  <path d="M 0 350 Q 100 280 200 320 Q 300 290 400 310 Q 500 270 600 300 Q 700 280 800 320 L 800 600 L 0 600 Z" 
        fill="url(#mountainFar)" filter="url(#blurFar)" />
  
  <!-- Mid-distance mountains (slight blur) -->
  <path d="M 0 380 Q 150 340 250 370 Q 350 330 450 360 Q 550 320 650 350 Q 750 330 800 360 L 800 600 L 0 600 Z" 
        fill="url(#mountainMid)" filter="url(#blurMid)" />
  
  <!-- Near mountains -->
  <path d="M 0 420 Q 120 380 220 410 Q 320 370 420 400 Q 520 360 620 390 Q 720 370 800 400 L 800 600 L 0 600 Z" 
        fill="url(#mountainNear)" />
  
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="150" fill="url(#groundGrad)" />
  
  <!-- Left Rumah Gadang -->
  <g transform="translate(120, 280)">
    <!-- Building body -->
    <rect x="0" y="60" width="160" height="110" fill="url(#woodGrad)" stroke="#5A4A30" stroke-width="2" />
    <!-- Windows -->
    <rect x="20" y="80" width="25" height="35" fill="#2E2418" stroke="#C9A96E" stroke-width="1.5" />
    <rect x="67" y="80" width="25" height="35" fill="#2E2418" stroke="#C9A96E" stroke-width="1.5" />
    <rect x="115" y="80" width="25" height="35" fill="#2E2418" stroke="#C9A96E" stroke-width="1.5" />
    <!-- Door -->
    <rect x="67" y="130" width="25" height="40" fill="#3A2818" stroke="#C9A96E" stroke-width="2" />
    <!-- Curved horn roof (gonjong) -->
    <path d="M -20 60 Q -30 20 -25 0 Q -20 -20 -10 -25 Q 0 -20 5 0 Q 10 20 0 60 Z" 
          fill="url(#roofGrad)" stroke="#C9A96E" stroke-width="2" />
    <path d="M 160 60 Q 150 20 155 0 Q 160 -20 170 -25 Q 180 -20 185 0 Q 190 20 180 60 Z" 
          fill="url(#roofGrad)" stroke="#C9A96E" stroke-width="2" />
    <!-- Main roof -->
    <path d="M -20 60 L 80 20 L 180 60 Z" fill="url(#roofGrad)" stroke="#C9A96E" stroke-width="2" />
    <!-- Roof ridge -->
    <path d="M 20 45 L 80 25 L 140 45" fill="none" stroke="#C9A96E" stroke-width="1.5" />
  </g>
  
  <!-- Right Rumah Gadang -->
  <g transform="translate(520, 290)">
    <!-- Building body -->
    <rect x="0" y="60" width="160" height="100" fill="url(#woodGrad)" stroke="#5A4A30" stroke-width="2" />
    <!-- Windows -->
    <rect x="20" y="75" width="25" height="35" fill="#2E2418" stroke="#C9A96E" stroke-width="1.5" />
    <rect x="67" y="75" width="25" height="35" fill="#2E2418" stroke="#C9A96E" stroke-width="1.5" />
    <rect x="115" y="75" width="25" height="35" fill="#2E2418" stroke="#C9A96E" stroke-width="1.5" />
    <!-- Door -->
    <rect x="67" y="120" width="25" height="40" fill="#3A2818" stroke="#C9A96E" stroke-width="2" />
    <!-- Curved horn roof (gonjong) -->
    <path d="M -20 60 Q -30 25 -25 5 Q -20 -15 -10 -20 Q 0 -15 5 5 Q 10 25 0 60 Z" 
          fill="url(#roofGrad)" stroke="#C9A96E" stroke-width="2" />
    <path d="M 160 60 Q 150 25 155 5 Q 160 -15 170 -20 Q 180 -15 185 5 Q 190 25 180 60 Z" 
          fill="url(#roofGrad)" stroke="#C9A96E" stroke-width="2" />
    <!-- Main roof -->
    <path d="M -20 60 L 80 25 L 180 60 Z" fill="url(#roofGrad)" stroke="#C9A96E" stroke-width="2" />
    <!-- Roof ridge -->
    <path d="M 20 48 L 80 30 L 140 48" fill="none" stroke="#C9A96E" stroke-width="1.5" />
  </g>
  
  <!-- Palm tree left -->
  <g transform="translate(50, 350)">
    <rect x="18" y="0" width="8" height="100" fill="#6B5237" />
    <path d="M 22 0 Q -10 -30 -30 -20 Q -10 -15 22 5" fill="#4A7C5C" />
    <path d="M 22 0 Q 50 -30 70 -20 Q 50 -15 22 5" fill="#4A7C5C" />
    <path d="M 22 0 Q 10 -40 5 -50 Q 15 -35 22 5" fill="#3A6048" />
    <path d="M 22 0 Q 35 -40 40 -50 Q 30 -35 22 5" fill="#3A6048" />
  </g>
  
  <!-- Palm tree right -->
  <g transform="translate(730, 360)">
    <rect x="18" y="0" width="8" height="90" fill="#6B5237" />
    <path d="M 22 0 Q -10 -30 -30 -20 Q -10 -15 22 5" fill="#4A7C5C" />
    <path d="M 22 0 Q 50 -30 70 -20 Q 50 -15 22 5" fill="#4A7C5C" />
    <path d="M 22 0 Q 10 -40 5 -50 Q 15 -35 22 5" fill="#3A6048" />
    <path d="M 22 0 Q 35 -40 40 -50 Q 30 -35 22 5" fill="#3A6048" />
  </g>
  
  <!-- Bushes -->
  <ellipse cx="100" cy="480" rx="45" ry="30" fill="#3A6048" />
  <ellipse cx="180" cy="485" rx="35" ry="25" fill="#4A7C5C" />
  <ellipse cx="620" cy="485" rx="40" ry="28" fill="#3A6048" />
  <ellipse cx="710" cy="480" rx="45" ry="30" fill="#4A7C5C" />
  
  <!-- Three-tiered fountain -->
  <g transform="translate(400, 470)">
    <!-- Basin -->
    <ellipse cx="0" cy="40" rx="80" ry="15" fill="#6B7B8B" stroke="#5A6A7A" stroke-width="2" />
    <ellipse cx="0" cy="35" rx="80" ry="15" fill="url(#waterGrad)" opacity="0.8" />
    <!-- First tier -->
    <ellipse cx="0" cy="20" rx="50" ry="10" fill="#7B8B9B" stroke="#6B7B8B" stroke-width="2" />
    <ellipse cx="0" cy="16" rx="50" ry="10" fill="url(#waterGrad)" opacity="0.7" />
    <!-- Second tier -->
    <ellipse cx="0" cy="5" rx="30" ry="7" fill="#8B9BAB" stroke="#7B8B9B" stroke-width="2" />
    <ellipse cx="0" cy="2" rx="30" ry="7" fill="url(#waterGrad)" opacity="0.6" />
    <!-- Top spout -->
    <circle cx="0" cy="-5" r="8" fill="#9BABBB" stroke="#8B9BAB" stroke-width="2" />
    <!-- Water spray -->
    <path d="M 0 -13 Q -5 -25 -10 -30" fill="none" stroke="#A8D8E8" stroke-width="1.5" opacity="0.7" />
    <path d="M 0 -13 Q 5 -25 10 -30" fill="none" stroke="#A8D8E8" stroke-width="1.5" opacity="0.7" />
    <path d="M 0 -13 Q 0 -30 0 -35" fill="none" stroke="#A8D8E8" stroke-width="1.5" opacity="0.7" />
    <circle cx="-10" cy="-30" r="2" fill="#A8D8E8" opacity="0.6" />
    <circle cx="10" cy="-30" r="2" fill="#A8D8E8" opacity="0.6" />
    <circle cx="0" cy="-35" r="2" fill="#A8D8E8" opacity="0.6" />
  </g>
  
  <!-- Yellow roses (left garden) -->
  <g transform="translate(150, 520)">
    <circle cx="0" cy="0" r="12" fill="#D4A84C" />
    <path d="M 0 -8 Q 4 -4 0 0 Q -4 -4 0 -8" fill="#E8C868" opacity="0.8" />
    <path d="M 0 -8 Q -4 -4 0 0 Q 4 -4 0 -8" fill="#E8C868" opacity="0.8" />
  </g>
  <g transform="translate(200, 535)">
    <circle cx="0" cy="0" r="10" fill="#D4A84C" />
    <path d="M 0 -7 Q 3 -3 0 0 Q -3 -3 0 -7" fill="#E8C868" opacity="0.8" />
    <path d="M 0 -7 Q -3 -3 0 0 Q 3 -3 0 -7" fill="#E8C868" opacity="0.8" />
  </g>
  
  <!-- Yellow roses (right garden) -->
  <g transform="translate(650, 525)">
    <circle cx="0" cy="0" r="11" fill="#D4A84C" />
    <path d="M 0 -8 Q 4 -4 0 0 Q -4 -4 0 -8" fill="#E8C868" opacity="0.8" />
    <path d="M 0 -8 Q -4 -4 0 0 Q 4 -4 0 -8" fill="#E8C868" opacity="0.8" />
  </g>
  
  <!-- White jasmine clusters -->
  <circle cx="130" cy="510" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="135" cy="508" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="140" cy="512" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="175" cy="528" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="180" cy="525" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="625" cy="515" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="630" cy="512" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="635" cy="518" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="680" cy="520" r="3" fill="#F5F5F0" opacity="0.9" />
  <circle cx="685" cy="518" r="3" fill="#F5F5F0" opacity="0.9" />
  
  <!-- Foreground grass details -->
  <path d="M 0 580 Q 50 570 100 580 Q 150 575 200 580 Q 250 572 300 580 Q 350 575 400 580 Q 450 572 500 580 Q 550 575 600 580 Q 650 572 700 580 Q 750 575 800 580" 
        fill="none" stroke="#3A6048" stroke-width="2" opacity="0.5" />
</svg>
