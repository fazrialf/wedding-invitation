<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8652D"/>
      <stop offset="40%" stop-color="#F5A623"/>
      <stop offset="70%" stop-color="#F9D062"/>
      <stop offset="100%" stop-color="#FFF8DC"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C5F7C"/>
      <stop offset="30%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#0F2440"/>
    </linearGradient>
    <linearGradient id="mtLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A1942"/>
      <stop offset="60%" stop-color="#6B2D5B"/>
      <stop offset="100%" stop-color="#8B4572"/>
    </linearGradient>
    <linearGradient id="mtRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A1942"/>
      <stop offset="50%" stop-color="#5C2350"/>
      <stop offset="100%" stop-color="#7A3968"/>
    </linearGradient>
    <linearGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflectionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="380" fill="url(#skyGrad)"/>
  <!-- Sun glow -->
  <circle cx="400" cy="280" r="120" fill="url(#sunGlow)"/>
  <circle cx="400" cy="280" r="40" fill="#FFF5D4" opacity="0.8"/>
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="90" ry="20" fill="#F5A623" opacity="0.3"/>
  <ellipse cx="600" cy="60" rx="110" ry="15" fill="#E8652D" opacity="0.25"/>
  <ellipse cx="500" cy="120" rx="70" ry="12" fill="#F9D062" opacity="0.2"/>
  <!-- Left Mountain -->
  <path d="M0 380 L80 180 L160 250 L220 160 L320 380 Z" fill="url(#mtLeft)"/>
  <path d="M80 180 L160 250 L220 160" fill="none" stroke="#8B4572" stroke-width="1.5" opacity="0.5"/>
  <!-- Right Mountain -->
  <path d="M450 380 L540 200 L600 260 L680 170 L800 380 Z" fill="url(#mtRight)"/>
  <path d="M540 200 L600 260 L680 170" fill="none" stroke="#7A3968" stroke-width="1.5" opacity="0.5"/>
  <!-- Distant mountain -->
  <path d="M250 380 L350 260 L420 300 L500 240 L550 380 Z" fill="#5C2350" opacity="0.5"/>
  <!-- Water -->
  <rect y="380" width="800" height="220" fill="url(#waterGrad)"/>
  <!-- Mountain reflections in water -->
  <path d="M0 380 L80 480 L160 440 L220 490 L320 380 Z" fill="#4A1942" opacity="0.2"/>
  <path d="M450 380 L540 470 L600 430 L680 500 L800 380 Z" fill="#4A1942" opacity="0.2"/>
  <!-- Water reflection ripples -->
  <line x1="200" y1="400" x2="350" y2="400" stroke="#F5A623" stroke-width="1" opacity="0.4"/>
  <line x1="380" y1="415" x2="500" y2="415" stroke="#F5A623" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="430" x2="520" y2="430" stroke="#F5A623" stroke-width="1" opacity="0.35"/>
  <line x1="250" y1="445" x2="400" y2="445" stroke="#F9D062" stroke-width="0.8" opacity="0.3"/>
  <line x1="420" y1="455" x2="560" y2="455" stroke="#F5A623" stroke-width="1.2" opacity="0.25"/>
  <line x1="320" y1="470" x2="480" y2="470" stroke="#F9D062" stroke-width="0.7" opacity="0.2"/>
  <line x1="150" y1="490" x2="350" y2="490" stroke="#F5A623" stroke-width="0.5" opacity="0.15"/>
  <line x1="440" y1="505" x2="600" y2="505" stroke="#F5A623" stroke-width="0.6" opacity="0.12"/>
  <!-- Stilt houses on left shore -->
  <rect x="30" y="350" width="35" height="25" fill="#3D1C02" opacity="0.9"/>
  <polygon points="25,350 65,350 47,335" fill="#5C2E00"/>
  <line x1="38" y1="375" x2="38" y2="395" stroke="#3D1C02" stroke-width="2"/>
  <line x1="55" y1="375" x2="55" y2="395" stroke="#3D1C02" stroke-width="2"/>
  <rect x="80" y="355" width="30" height="22" fill="#3D1C02" opacity="0.85"/>
  <polygon points="75,355 110,355 93,342" fill="#5C2E00"/>
  <line x1="87" y1="377" x2="87" y2="398" stroke="#3D1C02" stroke-width="2"/>
  <line x1="102" y1="377" x2="102" y2="398" stroke="#3D1C02" stroke-width="2"/>
  <!-- Palm trees near houses -->
  <line x1="125" y1="380" x2="130" y2="310" stroke="#4A3000" stroke-width="3"/>
  <path d="M130 310 Q140 295 160 300" fill="none" stroke="#2D5016" stroke-width="2.5"/>
  <path d="M130 310 Q115 290 100 305" fill="none" stroke="#2D5016" stroke-width="2.5"/>
  <path d="M130 310 Q135 285 145 290" fill="none" stroke="#3A6B20" stroke-width="2"/>
  <path d="M130 310 Q120 295 108 298" fill="none" stroke="#3A6B20" stroke-width="2"/>
  <line x1="15" y1="380" x2="12" y2="320" stroke="#4A3000" stroke-width="2.5"/>
  <path d="M12 320 Q22 305 38 310" fill="none" stroke="#2D5016" stroke-width="2"/>
  <path d="M12 320 Q2 305 -8 315" fill="none" stroke="#2D5016" stroke-width="2"/>
  <path d="M12 320 Q8 300 0 305" fill="none" stroke="#3A6B20" stroke-width="1.5"/>
  <!-- Flying birds -->
  <path d="M250 100 Q258 90 266 100" fill="none" stroke="#4A1942" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M300 130 Q306 122 312 130" fill="none" stroke="#4A1942" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M340 90 Q347 82 354 90" fill="none" stroke="#4A1942" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M450 110 Q456 103 462 110" fill="none" stroke="#4A1942" stroke-width="1" stroke-linecap="round"/>
  <path d="M280 155 Q285 148 290 155" fill="none" stroke="#4A1942" stroke-width="1" stroke-linecap="round"/>
  <!-- Foreground reeds -->
  <line x1="650" y1="600" x2="655" y2="520" stroke="#1B4332" stroke-width="2"/>
  <line x1="660" y1="600" x2="658" y2="530" stroke="#2D5016" stroke-width="1.5"/>
  <line x1="670" y1="600" x2="674" y2="510" stroke="#1B4332" stroke-width="2"/>
  <line x1="680" y1="600" x2="678" y2="540" stroke="#2D5016" stroke-width="1.5"/>
  <line x1="690" y1="600" x2="693" y2="525" stroke="#1B4332" stroke-width="1.8"/>
  <line x1="720" y1="600" x2="718" y2="515" stroke="#1B4332" stroke-width="2"/>
  <line x1="730" y1="600" x2="733" y2="535" stroke="#2D5016" stroke-width="1.5"/>
  <line x1="740" y1="600" x2="738" y2="520" stroke="#1B4332" stroke-width="2"/>
  <line x1="750" y1="600" x2="753" y2="545" stroke="#2D5016" stroke-width="1.5"/>
  <!-- Reed tops (cattails) -->
  <ellipse cx="655" cy="518" rx="2.5" ry="8" fill="#4A3000"/>
  <ellipse cx="674" cy="508" rx="2.5" ry="8" fill="#4A3000"/>
  <ellipse cx="693" cy="523" rx="2" ry="7" fill="#4A3000"/>
  <ellipse cx="718" cy="513" rx="2.5" ry="8" fill="#4A3000"/>
  <ellipse cx="738" cy="518" rx="2.5" ry="8" fill="#4A3000"/>
  <!-- Water plants left foreground -->
  <path d="M0 580 Q20 560 40 570 Q60 555 80 565 Q100 550 120 560 L120 600 L0 600 Z" fill="#1B4332" opacity="0.7"/>
  <path d="M0 590 Q15 575 30 580 Q50 565 70 575 L70 600 L0 600 Z" fill="#2D6A4F" opacity="0.6"/>
  <!-- Lily pads -->
  <ellipse cx="500" cy="550" rx="15" ry="8" fill="#2D6A4F" opacity="0.5"/>
  <ellipse cx="550" cy="540" rx="12" ry="6" fill="#1B4332" opacity="0.4"/>
</svg>